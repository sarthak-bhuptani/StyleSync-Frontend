<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Smooth background lighting for squircle badge -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF7F2" />
      <stop offset="100%" stop-color="#EFE8DD" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1A1A1A" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Squircle Canvas with subtle border -->
  <rect width="100" height="100" rx="26" fill="url(#bgGrad)" />
  <rect x="0.75" y="0.75" width="98.5" height="98.5" rx="25.25" stroke="#E2DACD" stroke-width="1.5" />

  <!-- 4-point Sparkle Star -->
  <path d="M75 18 C75 21.5 78.5 25 82 25 C78.5 25 75 28.5 75 32 C75 28.5 71.5 25 68 25 C71.5 25 75 21.5 75 18 Z" fill="#1A1A1A" />

  <!-- Interlocking S Monogram -->
  <!-- Left S: Olive Green -->
  <text x="14" y="62" font-family="'Playfair Display', Didot, 'Newsreader', Georgia, serif" font-size="56" font-weight="600" fill="#6B7A5A" letter-spacing="-1">S</text>

  <!-- Right S: Charcoal -->
  <text x="34" y="65" font-family="'Playfair Display', Didot, 'Newsreader', Georgia, serif" font-size="56" font-weight="600" fill="#1A1A1A" letter-spacing="-1">S</text>

  <!-- Wordmark underneath -->
  <text x="50" y="86" text-anchor="middle" font-family="'Playfair Display', 'Newsreader', Georgia, serif" font-size="12" font-weight="600" fill="#1A1A1A" letter-spacing="-0.2px">StyleSync</text>
</svg>